<style>
/* Layout: ranked helix scene (rank = height, size = return, colour = party); ranking list top-left, detail right (bottom sheet on phones), control bar bottom. */
:root {
  --bg: #0b0b0e;
  --panel: rgba(17, 17, 22, 0.84);
  --line: #2b2823;
  --fg: #ece6d9;
  --dim: #9b9384;
  --buy: #4fae8a;
  --sell: #c4505a;
  --dem: #6f8fc9;
  --rep: #c98a5a;
  --exec: #b8975a;
  --other: #a9a59c;
  --display: "Cinzel", "Trajan Pro", Georgia, serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 13.5px/1.5 var(--sans, "Manrope", system-ui, sans-serif); overflow: hidden; }
canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
.panel { position: fixed; background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-sizing: border-box; }
button { font-family: var(--sans, "Manrope", system-ui, sans-serif); }
button:focus-visible, summary:focus-visible { outline: 2px solid var(--buy); outline-offset: 2px; }

#head { top: max(16px, env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); width: min(350px, calc(100vw - 32px)); max-height: calc(100% - 100px); overflow: auto; padding: 14px 14px 12px; }
#head h1 { margin: 0; font: 700 22px/1.12 var(--display); letter-spacing: 0.05em; text-transform: uppercase; }
#head h1 .l2 { display: inline-flex; align-items: flex-end; gap: 8px; }
.swans { display: inline-flex; align-items: flex-end; gap: 0; margin-bottom: -2px; color: var(--fg); }
.swan { width: 36px; height: 28px; overflow: visible; }
.swan.two { width: 30px; height: 23px; transform: scaleX(-1); margin-left: -4px; }
.swan .body, .swan .head { fill: var(--fg); }
.swan .wing { stroke: var(--bg); opacity: 0.45; fill: none; }
.swan .neck { stroke: var(--fg); fill: none; }
.swan .beak { fill: var(--exec); }
.swan .eye { fill: var(--bg); }
.swan .rip { stroke: var(--dem); fill: none; opacity: 0.6; transform-box: fill-box; transform-origin: center; }
.swan .bob { animation: bob 3.2s ease-in-out infinite alternate; }
.swan.two .bob { animation-duration: 2.7s; animation-delay: -1.1s; }
.swan .nk { transform-box: view-box; transform-origin: 28px 20px; animation: sway 4.1s ease-in-out infinite alternate; }
.swan.two .nk { animation-duration: 3.6s; animation-delay: -1.7s; }
.swan .rip { animation: rip 3.2s ease-in-out infinite alternate; }
@keyframes bob { from { transform: translateY(0); } to { transform: translateY(-1.6px); } }
@keyframes sway { from { transform: rotate(-4deg); } to { transform: rotate(5deg); } }
@keyframes rip { from { transform: scaleX(0.82); opacity: 0.25; } to { transform: scaleX(1.06); opacity: 0.7; } }
@media (prefers-reduced-motion: reduce) { .swan .bob, .swan .nk, .swan .rip { animation: none; } }

.lede { margin: 8px 0 10px; color: var(--dim); font-size: 12px; }
.median { display: flex; justify-content: space-between; gap: 10px; padding: 7px 8px; border: 1px dashed var(--line); margin-bottom: 8px; font-size: 12px; color: var(--dim); }
.median b { color: var(--sell); font-weight: 500; white-space: nowrap; font-variant-numeric: tabular-nums; }
#list { display: flex; flex-direction: column; }
#list button { all: unset; box-sizing: border-box; display: grid; grid-template-columns: 22px 10px 1fr auto; gap: 8px; align-items: center; padding: 6px 4px; border-top: 1px solid var(--line); cursor: pointer; }
#list button:hover { background: rgba(90, 162, 255, 0.1); }
#list button[aria-current="true"] { background: rgba(184, 151, 90, 0.12); }
#list button:focus-visible { outline: 2px solid var(--buy); }
#list .rk { color: var(--dim); font-variant-numeric: tabular-nums; }
#list .dot { width: 8px; height: 8px; border-radius: 50%; }
#list .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#list .pc { color: var(--buy); font-variant-numeric: tabular-nums; }
summary { cursor: pointer; color: var(--fg); margin: 2px 0 6px; }
details.about { margin-top: 10px; color: var(--dim); font-size: 12px; }
details.about p { margin: 6px 0 0; }

#detail { top: max(16px, env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); width: min(330px, calc(100vw - 32px)); max-height: calc(100% - 100px); overflow: auto; padding: 14px 16px; }
#detail h2 { margin: 0; font: 700 19px/1.15 var(--display); letter-spacing: 0.02em; }
#detail .sub { color: var(--dim); margin: 3px 0 12px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; margin-bottom: 14px; }
.grid div { min-width: 0; }
.grid b { display: block; font: 500 16px/1.15 var(--mono); font-variant-numeric: tabular-nums; }
.grid span { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); }
.up { color: var(--buy); } .down { color: var(--sell); }
#detail h3 { margin: 12px 0 6px; font: 500 10px/1 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); }
.rows { display: flex; flex-direction: column; }
.rows .row { all: unset; box-sizing: border-box; display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 6px 4px; border-top: 1px solid var(--line); }
.rows button.row { cursor: pointer; }
.rows button.row:hover { background: rgba(90, 162, 255, 0.1); }
.rows button.row:focus-visible { outline: 2px solid var(--buy); }
.rows .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rows .m { color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
.rows .m .up, .rows .m .down { font-weight: 500; }
.note { color: var(--dim); font-size: 11px; margin: 10px 0 0; }

#bar { left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); padding: 10px 12px; display: flex; gap: 10px 18px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
#bar .tools { display: flex; gap: 6px; flex-wrap: wrap; }
#bar button { all: unset; box-sizing: border-box; padding: 5px 10px; border: 1px solid var(--line); cursor: pointer; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; }
#bar button:focus-visible { outline: 2px solid var(--buy); }
#bar button[aria-pressed="true"] { border-color: var(--buy); color: var(--buy); }
#bar button#tSell[aria-pressed="true"] { border-color: var(--sell); color: var(--sell); }
#hover { color: var(--dim); flex: 1 1 200px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; color: var(--dim); font-size: 11px; }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
.legend i.sq { border-radius: 0; transform: rotate(45deg); }
.lbl { position: fixed; left: 0; top: 0; pointer-events: none; font: 400 11px/1 var(--mono); color: var(--fg); text-shadow: 0 0 6px var(--bg), 0 0 3px var(--bg); white-space: nowrap; will-change: transform; }
.lbl.f { font-size: 12px; }
@media (max-width: 700px) {
  #detail { top: auto; right: max(16px, env(safe-area-inset-right, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); width: auto; bottom: calc(max(16px, env(safe-area-inset-bottom, 0px)) + 112px); max-height: 38vh; }
  #detail.empty { display: none; }
  #head { max-height: 56vh; }
  #head h1 { font-size: 19px; }
  .lede, .legend { display: none; }
}

/* ---- views, charts, orb ---- */
:root { --barh: 64px; --violet: #8fa3d6; --tapeh: 30px; }
#tape { position: fixed; top: 0; left: 0; right: 0; height: var(--tapeh); overflow: hidden; z-index: 6; background: rgba(5, 8, 16, 0.92); border-bottom: 1px solid var(--line); white-space: nowrap; }
#tapeIn { display: inline-flex; gap: 0; animation: tape 90s linear infinite; will-change: transform; }
#tape:hover #tapeIn { animation-play-state: paused; }
#tape .tk { all: unset; cursor: pointer; padding: 0 14px; line-height: var(--tapeh); font-size: 12px; font-variant-numeric: tabular-nums; border-right: 1px solid var(--line); }
#tape .tk b { font-weight: 500; color: var(--dim); } #tape .tk i { font-style: normal; } #tape .tk i.up { color: var(--buy); } #tape .tk i.down { color: var(--sell); }
#tape .tk:focus-visible { outline: 2px solid var(--buy); outline-offset: -2px; }
@keyframes tape { from { transform: translateX(0); } to { transform: translateX(-50%); } }
@media (prefers-reduced-motion: reduce) { #tapeIn { animation: none; } #tape { overflow-x: auto; } }
#head, #detail { top: calc(var(--tapeh) + 12px) !important; }
.deck { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 12px; }
.deck .card { border: 1px solid var(--line); padding: 10px 12px; background: rgba(9, 14, 26, 0.55); min-width: 0; }
.deck .c12 { grid-column: span 12; } .deck .c7 { grid-column: span 7; } .deck .c6 { grid-column: span 6; } .deck .c5 { grid-column: span 5; }
.deck .fresh.card { padding: 8px; }
@media (max-width: 900px) { .deck .c7, .deck .c6, .deck .c5 { grid-column: span 12; } }
.deckSub { display: block; font: 500 11px/1.4 var(--mono); letter-spacing: 0.12em; color: var(--buy); margin-top: 2px; }
#cTitle .swans { vertical-align: -4px; margin-left: 6px; }
.why { margin: 0 0 6px; padding-left: 16px; color: var(--fg); font-size: 12px; } .why li { margin: 3px 0; }
.hero { grid-column: span 12; display: grid; grid-template-columns: 1fr minmax(120px, 190px); gap: 14px; align-items: center; border: 1px solid rgba(255, 110, 50, 0.45); padding: 14px 16px; background: radial-gradient(120% 140% at 85% 60%, rgba(255, 74, 28, 0.28), rgba(120, 10, 20, 0.12) 45%, rgba(9, 14, 26, 0.6) 75%); position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; inset: auto -10% -40% 40%; height: 70%; background: radial-gradient(closest-side, rgba(255, 120, 40, 0.35), rgba(255, 120, 40, 0)); animation: emberPulse 4.5s ease-in-out infinite; pointer-events: none; }
@keyframes emberPulse { 0%, 100% { opacity: 0.55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.06); } }
@media (prefers-reduced-motion: reduce) { .hero::after { animation: none; } }
.hero h3 { margin: 0 0 2px; font: 600 13px/1.2 var(--display); letter-spacing: 0.1em; text-transform: uppercase; color: #ff9a5c; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.regime { font: 500 11px/1 var(--mono); letter-spacing: 0.08em; padding: 4px 8px; border: 1px solid currentColor; }
.regime.off { color: var(--sell); } .regime.on { color: var(--buy); } .regime.mixed { color: var(--exec); }
.brief { list-style: none; margin: 8px 0 10px; padding: 0; display: flex; flex-direction: column; gap: 7px; position: relative; z-index: 1; }
.brief li { font-size: 14px; line-height: 1.45; padding-left: 14px; border-left: 2px solid rgba(255, 140, 70, 0.6); }
.brief li b { font-weight: 500; color: #fff; }
.hero .swanpic { width: 100%; max-height: 210px; object-fit: contain; filter: drop-shadow(0 0 18px rgba(255, 90, 30, 0.75)) brightness(0.9); position: relative; z-index: 1; animation: swanBob 5s ease-in-out infinite; }
@keyframes swanBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@media (prefers-reduced-motion: reduce) { .hero .swanpic { animation: none; } }
@media (max-width: 700px) { .hero { grid-template-columns: 1fr 90px; } .brief li { font-size: 13px; } }
.heroBtns { display: flex; gap: 8px; flex-wrap: wrap; position: relative; z-index: 1; }
.askb { all: unset; box-sizing: border-box; display: inline-block; margin-top: 10px; padding: 5px 10px; border: 1px solid var(--buy); color: var(--buy); cursor: pointer; font-size: 12px; }
.askb:hover, .askb:focus-visible { background: rgba(184, 151, 90, 0.1); outline: none; }
#bar .views { display: flex; gap: 6px; flex-wrap: wrap; }
body:not(.v-c) .only-c { display: none !important; }
body.v-hot #head, body.v-hot #detail, body.v-hot #labels, body.v-timeline #head, body.v-timeline #detail, body.v-timeline #labels, body.v-markets #head, body.v-markets #detail, body.v-markets #labels { display: none; }
body.v-hot #hover, body.v-timeline #hover, body.v-hot .legend, body.v-timeline .legend, body.v-markets #hover, body.v-markets .legend { display: none; }
#charts { top: calc(var(--tapeh) + 12px); left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(var(--barh) + max(16px, env(safe-area-inset-bottom, 0px)) + 96px); padding: 14px 16px; display: none; flex-direction: column; min-height: 0; z-index: 5; background: rgba(7, 11, 21, 0.9); }
body.v-hot #charts, body.v-timeline #charts, body.v-markets #charts { display: flex; }
.livebox { display: flex; gap: 6px; align-items: center; }
.live { font-size: 11px; letter-spacing: 0.04em; padding: 4px 8px; border: 1px solid var(--line); color: var(--dim); white-space: nowrap; }
.live.live { color: var(--buy); border-color: rgba(184, 151, 90, 0.5); }
.live.error { color: var(--exec); border-color: rgba(255, 209, 102, 0.5); }
#bar button#liveGo { border-color: var(--exec); color: var(--exec); }
#bar button[hidden] { display: none; }
body.v-markets #bar .tools { display: none; }
.mkwrap { display: flex; flex-direction: column; gap: 14px; padding-bottom: 8px; }
.fresh { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.fcell { border: 1px solid var(--line); padding: 6px 8px; }
.fcell span { display: block; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); }
.fcell b { font-weight: 500; font-variant-numeric: tabular-nums; }
.fcell small { color: var(--dim); margin-left: 6px; }
.mk h3 { margin: 0 0 4px; font: 600 13px/1.2 var(--display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg); }
.mk h4 { margin: 0 0 4px; font: 500 11px/1.2 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); }
.mnote { margin: 0 0 8px; color: var(--dim); font-size: 11.5px; max-width: 90ch; }
.qgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 6px; }
.qt { all: unset; box-sizing: border-box; border: 1px solid var(--line); padding: 6px 8px; display: flex; flex-direction: column; gap: 1px; cursor: pointer; }
button.qt:hover { border-color: var(--dem); }
.qt span { font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--dim); }
.qt b { font-weight: 500; font-size: 14px; font-variant-numeric: tabular-nums; }
.qt i { font-style: normal; font-size: 11.5px; font-variant-numeric: tabular-nums; color: var(--dim); }
.qt i.up { color: var(--buy); } .qt i.down { color: var(--sell); }
.srow { display: grid; grid-template-columns: minmax(110px, 190px) 1fr 76px; gap: 10px; align-items: center; padding: 3px 0; }
.srow span { font-size: 12px; } .srow em { font-style: normal; font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }
.sbar { position: relative; height: 12px; } .sbar::after { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--dim); opacity: .6; }
.sbar b { position: absolute; top: 0; height: 100%; } .sbar b.p { left: 50%; background: var(--buy); } .sbar b.n { right: 50%; background: var(--sell); }
.tw { overflow-x: auto; }
table.mt { border-collapse: collapse; width: 100%; font-size: 12px; }
table.mt th { text-align: left; font-weight: 500; color: var(--dim); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; padding: 4px 6px; border-bottom: 1px solid var(--line); }
table.mt td { padding: 4px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.mt .n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.mt td.up { color: var(--buy); } table.mt td.down { color: var(--sell); }
.sym { all: unset; cursor: pointer; color: var(--fg); border-bottom: 1px dotted var(--dim); font-weight: 500; }
.sym:hover, .sym:focus-visible { color: var(--buy); border-color: var(--buy); outline: none; }
.mv3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.up { color: var(--buy); } .down { color: var(--sell); }
#charts h2 { margin: 0; font: 700 20px/1.15 var(--display); letter-spacing: 0.03em; text-transform: uppercase; }
#charts .sub { color: var(--dim); margin: 4px 0 10px; max-width: 78ch; font-size: 12px; }
.ctl { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
.ctl span { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; margin-right: 4px; }
.ctl button { all: unset; box-sizing: border-box; padding: 4px 10px; border: 1px solid var(--line); cursor: pointer; font-size: 12px; }
.ctl button[aria-pressed="true"] { border-color: var(--buy); color: var(--buy); }
.ctl button:focus-visible { outline: 2px solid var(--buy); }
#cbody { position: relative; flex: 1; min-height: 0; overflow: auto; }
.legend2 { display: flex; gap: 14px; flex-wrap: wrap; color: var(--dim); font-size: 11px; margin-top: 8px; }
.legend2 i { display: inline-block; width: 10px; height: 10px; margin-right: 5px; vertical-align: -1px; }
.hrow { all: unset; box-sizing: border-box; display: grid; grid-template-columns: minmax(130px, 220px) 1fr minmax(210px, 290px); gap: 12px; align-items: center; width: 100%; padding: 7px 4px; border-top: 1px solid var(--line); cursor: pointer; }
.hrow:hover { background: rgba(90, 162, 255, 0.08); }
.hrow:focus-visible { outline: 2px solid var(--buy); }
.hrow .tk { font: 500 14px/1.1 var(--mono); }
.hrow .tk small { display: block; color: var(--dim); font-size: 11px; font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
.dbar { position: relative; height: 16px; display: grid; grid-template-columns: 1fr 1fr; }
.dbar::after { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--line); }
.dbar .l { display: flex; justify-content: flex-end; }

.tt { position: absolute; pointer-events: none; background: #0b1426; border: 1px solid var(--line); padding: 7px 9px; font-size: 12px; max-width: 260px; z-index: 3; display: none; }
.tt b { font-weight: 500; }
svg.tl text { font: 400 11px var(--mono); fill: var(--dim); }
svg.tl text.ln { fill: var(--fg); cursor: pointer; }

}

/* ---- Caesar's brain: the JARVIS layer ---- */

#orb.alert::after { content: ""; position: absolute; top: 1px; right: 1px; width: 13px; height: 13px; border-radius: 50%; background: var(--exec); box-shadow: 0 0 10px var(--exec); border: 2px solid var(--bg); }

#chat .top button#cAlerts[aria-pressed="true"] { border-color: var(--exec); color: var(--exec); }
#chat .top a.line { box-sizing: border-box; padding: 4px 10px; border: 1px solid var(--buy); color: var(--buy); font-size: 12px; text-decoration: none; white-space: nowrap; }
#chat .top a.line:hover, #chat .top a.line:focus-visible { background: rgba(184, 151, 90, 0.1); outline: none; }

@keyframes micPulse { 50% { box-shadow: 0 0 0 4px rgba(196, 80, 90, 0.25); } }

/* ================= v13 Caesar OS: the black swan is the operating system ================= */
/* Palette: obsidian, graphite, midnight blue, deep crimson, antique gold. One deliberate dark look. */
:root { --sans: "Manrope", "Segoe UI", system-ui, sans-serif; --gold: #b8975a; --gold-hi: #dcc28c; --crimson: #7a1f2b; --crimson-hi: #a8323f; --midnight: #0f1626; --graphite: #17171c; --ivory: #ece6d9; --hair: rgba(184, 151, 90, 0.22); --glass: rgba(20, 20, 26, 0.66); }
body { background: radial-gradient(120% 90% at 50% 34%, #121826 0%, #0b0b0e 62%) fixed, var(--bg); }
#tape { background: rgba(11, 11, 14, 0.94); border-bottom-color: var(--hair); }
#tape .tk, .pill, .live, time, .num, #chat input, .mono { font-family: var(--mono); }
.panel { border-color: var(--hair); }
#charts { background: rgba(13, 13, 17, 0.9); }
#charts h2 { font-weight: 600; letter-spacing: 0.08em; }
.deck .card { background: rgba(20, 20, 26, 0.55); border-color: var(--hair); }
.deckSub { color: var(--gold); }
.hero { border-color: rgba(184, 151, 90, 0.35); background: radial-gradient(120% 140% at 85% 60%, rgba(122, 31, 43, 0.3), rgba(15, 22, 38, 0.4) 45%, rgba(17, 17, 21, 0.6) 75%); }
.hero::after { background: radial-gradient(closest-side, rgba(184, 151, 90, 0.14), rgba(184, 151, 90, 0)); }
.hero h3 { color: var(--gold-hi); font-weight: 600; }
.brief li { border-left-color: rgba(184, 151, 90, 0.55); }
.brief li b { color: var(--ivory); }
.hero .swanpic { filter: drop-shadow(0 0 16px rgba(122, 31, 43, 0.55)); border-radius: 50%; }
.askb { border-color: var(--gold); color: var(--gold-hi); }
button:focus-visible, summary:focus-visible { outline-color: var(--gold); }
#chat { background: rgba(14, 14, 18, 0.96); border-color: var(--hair); }
#chat .top b { font-weight: 600; letter-spacing: 0.18em; color: var(--gold-hi); }
#chat .top a.line, #chat form button.go { border-color: var(--gold); color: var(--gold-hi); }
#chat input { background: #0e0e12; }
#chat button:focus-visible, #chat input:focus-visible { outline-color: var(--gold); }

/* the orb is now a small swan medallion with a slow gold arc */
#orb { background: var(--swan, none) center 34% / 150% no-repeat, radial-gradient(circle at 50% 40%, #1b1f2b, #0b0b0e); box-shadow: 0 0 0 1px rgba(184, 151, 90, 0.6), 0 6px 24px rgba(0, 0, 0, 0.6), 0 0 26px rgba(122, 31, 43, 0.35); animation: none; }
#orb::before { inset: -4px; background: conic-gradient(from 0deg, rgba(220, 194, 140, 0), rgba(220, 194, 140, 0.75) 12%, rgba(220, 194, 140, 0) 30%, rgba(220, 194, 140, 0)); -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 1.5px)); mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 1.5px)); mix-blend-mode: normal; }
#orb.busy::before { animation-duration: 1.2s; }
#orb span { font: 600 10px/1 var(--display); letter-spacing: 0.22em; color: var(--gold-hi); }
body.speaking #orb { box-shadow: 0 0 0 1px rgba(220, 194, 140, 0.8), 0 0 34px rgba(168, 50, 63, 0.6); }

/* rooms: the constellation bar on every screen except the Command Centre */
.rooms { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; flex: 1 1 100%; min-width: 0; padding-bottom: 2px; border-bottom: 1px solid var(--hair); }
.rooms::-webkit-scrollbar { display: none; }
#bar .rooms button { all: unset; box-sizing: border-box; cursor: pointer; padding: 6px 10px 7px; font: 600 10.5px/1 var(--display); letter-spacing: 0.16em; text-transform: uppercase; color: var(--dim); white-space: nowrap; border-bottom: 1px solid transparent; display: inline-flex; align-items: center; gap: 7px; }
#bar .rooms button:hover, #bar .rooms button:focus-visible { color: var(--ivory); outline: none; }
#bar .rooms button[aria-pressed="true"] { color: var(--gold-hi); border-bottom-color: var(--gold); }
.rooms .home i { width: 18px; height: 18px; border-radius: 50%; background: var(--swan, none) center 34% / 150% no-repeat, #121620; box-shadow: 0 0 0 1px rgba(184, 151, 90, 0.6); }
#bar .views button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold-hi); }
#bar button:focus-visible { outline-color: var(--gold); }
body:not(.room-trading) #bar .views, body:not(.room-trading) #bar .tools { display: none !important; }
body.room-opps #head, body.room-opps #detail, body.room-opps #labels, body.room-opps #hover, body.room-opps .legend,
body.room-intel #head, body.room-intel #detail, body.room-intel #labels, body.room-intel #hover, body.room-intel .legend,
body.room-wealth #head, body.room-wealth #detail, body.room-wealth #labels, body.room-wealth #hover, body.room-wealth .legend,
body.room-biz #head, body.room-biz #detail, body.room-biz #labels, body.room-biz #hover, body.room-biz .legend,
body.room-settings #head, body.room-settings #detail, body.room-settings #labels, body.room-settings #hover, body.room-settings .legend { display: none; }
body.room-opps #charts, body.room-intel #charts, body.room-wealth #charts, body.room-biz #charts, body.room-settings #charts { display: flex; }

/* ---------- the Command Centre ---------- */
#cc { position: fixed; top: var(--tapeh); left: 0; right: 0; bottom: 0; z-index: 4; display: none; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; box-sizing: border-box; padding-block: 18px calc(28px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body.v-cc #cc { display: block; }
body.v-cc canvas#gl { visibility: hidden; }
body.v-cc #labels, body.v-cc #head, body.v-cc #detail, body.v-cc #charts, body.v-cc #bar, body.v-cc #orb { display: none !important; }
.ccgrid { --S: min(540px, calc(100vh - 250px)); max-width: 1500px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, var(--S)) minmax(0, 1fr); grid-template-areas: "l s r" "f f f"; gap: 20px 28px; align-items: start; }
.cccol { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.cccol.l { grid-area: l; } .cccol.r { grid-area: r; } .ccstage { grid-area: s; } .ccfoot { grid-area: f; }
.ccstage { display: flex; flex-direction: column; align-items: center; gap: 12px; min-width: 0; }
.ringwrap { position: relative; width: min(var(--S), 100%); aspect-ratio: 1; container-type: inline-size; }
.ringwrap svg.ring { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.ring .rot { transform-origin: 500px 500px; animation: ringTurn 300s linear infinite; }
.ring .rot2 { transform-origin: 500px 500px; animation: ringTurn 520s linear infinite reverse; }
@keyframes ringTurn { to { transform: rotate(360deg); } }
.ringwrap svg.ring { filter: drop-shadow(0 0 6px rgba(168, 50, 63, 0.35)); }
.ring .cal { font-family: "Noto Nastaliq Urdu", "Noto Naskh Arabic", "Amiri", "Times New Roman", serif; font-weight: 700; font-size: 56px; fill: #8e2433; }
body.speaking .ring .cal, body.thinking .ring .cal { fill: #a8323f; transition: fill 0.6s; }
.ring .mote { fill: var(--gold-hi); animation: twinkle 6s ease-in-out infinite; }
@keyframes twinkle { 0%, 100% { opacity: 0.12; } 50% { opacity: 0.9; } }
.ccglow { position: absolute; left: 50%; top: 50%; width: 74%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(closest-side, rgba(168, 50, 63, 0.26), rgba(184, 151, 90, 0.07) 58%, rgba(0, 0, 0, 0) 74%); opacity: 0.5; animation: breathe 7s ease-in-out infinite; pointer-events: none; }
body.speaking .ccglow, body.thinking .ccglow { opacity: 1; animation-duration: 1.8s; }
@keyframes breathe { 0%, 100% { transform: translate(-50%, -50%) scale(0.97); } 50% { transform: translate(-50%, -50%) scale(1.03); } }
.ripples i { position: absolute; left: 50%; top: 79%; width: 44%; height: 8%; border: 1px solid rgba(184, 151, 90, 0.3); border-radius: 50%; transform: translate(-50%, -50%) scale(0.5); opacity: 0; animation: ripple 7.5s ease-out infinite; pointer-events: none; }
.ripples i:nth-child(2) { animation-delay: 2.5s; } .ripples i:nth-child(3) { animation-delay: 5s; }
@keyframes ripple { 0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; } 15% { opacity: 0.75; } 100% { transform: translate(-50%, -50%) scale(1.7); opacity: 0; } }
body.speaking .ripples i, body.thinking .ripples i { animation-duration: 2.4s; border-color: rgba(220, 194, 140, 0.55); }
.swanBtn { all: unset; position: absolute; left: 50%; top: 50%; width: 60%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; cursor: pointer; z-index: 2; overflow: hidden; }
.swanBtn .swanArt { position: absolute; inset: 0; animation: swanFloat 8s ease-in-out infinite; transform-origin: 50% 72%; }
.swanBtn img, .swanBtn svg { width: 100%; height: 100%; display: block; }
.swanBtn::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(38% 28% at 50% 50%, rgba(220, 194, 140, 0.16), rgba(220, 194, 140, 0) 70%) 0 0 / 220% 220% no-repeat; mix-blend-mode: screen; animation: sweep 16s ease-in-out infinite alternate; pointer-events: none; }
@keyframes swanFloat { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-1.4%) scale(1.014); } }
@keyframes sweep { from { background-position: 10% 0%; } to { background-position: 90% 40%; } }
.swanBtn:focus-visible { outline: 1px solid var(--gold); outline-offset: 8px; }
.swanBtn .tapHint { position: absolute; left: 50%; bottom: 6%; transform: translateX(-50%); font: 600 9.5px/1 var(--display); letter-spacing: 0.24em; color: rgba(220, 194, 140, 0.85); text-transform: uppercase; opacity: 0; transition: opacity 0.3s; white-space: nowrap; }
.swanBtn:hover .tapHint, .swanBtn:focus-visible .tapHint { opacity: 1; }
.st { all: unset; box-sizing: border-box; position: absolute; left: 50%; top: 50%; z-index: 3; cursor: pointer; transform: translate(-50%, -50%) rotate(var(--a)) translateY(-46.4cqw) rotate(calc(-1 * var(--a))); display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 4px 6px; font: 600 10.5px/1 var(--display); letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold-hi); white-space: nowrap; }

.st:hover i, .st:focus-visible i { background: var(--gold); box-shadow: 0 0 12px rgba(220, 194, 140, 0.6); }
.st:hover, .st:focus-visible { color: #fff; outline: none; }
.st small { font: 500 9px/1 var(--mono); letter-spacing: 0; text-transform: none; color: var(--dim); }
.ccname { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
.ccname b { font: 600 26px/1 var(--display); letter-spacing: 0.42em; margin-right: -0.42em; color: var(--ivory); }
.ccname small { font: 500 11px/1.3 var(--mono); color: var(--dim); min-height: 1.3em; }
.ccname small.live { color: var(--gold-hi); }
.ccname em { font: italic 400 12.5px/1.3 Georgia, "Times New Roman", serif; color: rgba(236, 230, 217, 0.62); }
.ccCmd { display: flex; gap: 6px; width: min(100%, 520px); }
.ccCmd input { flex: 1; min-width: 0; background: rgba(14, 14, 18, 0.9); color: var(--ivory); border: 1px solid var(--hair); padding: 11px 14px; font: 400 14px/1.2 var(--sans); }
.ccCmd input::placeholder { color: rgba(236, 230, 217, 0.4); font-style: italic; }
.ccCmd input:focus-visible { outline: 1px solid var(--gold); border-color: var(--gold); }
.ccCmd button { all: unset; box-sizing: border-box; cursor: pointer; padding: 0 16px; border: 1px solid var(--gold); color: var(--gold-hi); font: 600 11px/1 var(--display); letter-spacing: 0.2em; text-transform: uppercase; display: inline-flex; align-items: center; }
.ccCmd button:hover, .ccCmd button:focus-visible { background: rgba(184, 151, 90, 0.12); outline: none; }
.ccCmd button[aria-pressed="true"] { border-color: var(--crimson-hi); color: #f2b8bf; }
.sugs { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; max-width: 560px; }

.sug:hover, .sug:focus-visible { border-color: var(--gold); color: #fff; outline: none; }

/* glass cards that orbit the swan */
.cx { position: relative; background: var(--glass); border: 1px solid var(--hair); padding: 14px 16px 15px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); min-width: 0; box-sizing: border-box; }
.cx::before { content: ""; position: absolute; top: -1px; left: -1px; width: 14px; height: 14px; border-top: 1px solid var(--gold); border-left: 1px solid var(--gold); pointer-events: none; }

  function capBody() { if (!vCap.querySelector('.cb')) { vCap.replaceChildren(); const x = el('button', '', '×'); x.type = 'button'; x.setAttribute('aria-label', 'Close captions'); x.onclick = () => { capHide(); cvHalt(); }; vCap.append(x, el('div', 'cb')); } return vCap.querySelector('.cb'); }
  function capUser(t) { capOpen(); const b = capBody(); b.replaceChildren(el('div', 'you', t)); }
  function capThink() { capOpen(); const b = capBody(); let h = b.querySelector('.him'); if (!h) { h = el('div', 'him'); b.append(h); } h.textContent = 'Thinking…'; }
  function capSay(t, partial) { capOpen(); const b = capBody(); let h = b.querySelector('.him'); if (!h) { h = el('div', 'him'); b.append(h); } h.textContent = t; capStatus(); if (!partial) capLater(); }
  function capStatus() { if (vCap.hidden) return; const b = capBody(); let st = b.querySelector('.st'); const msg = CV.err ? 'Voice unavailable here: reading only.' : CV.tts ? '' : CV.loading ? 'Preparing George’s voice · ' + (CV.pct || 0) + '% (first time only)' : ''; if (!msg) { if (st) st.remove(); return; } if (!st) { st = el('div', 'st'); b.append(st); } st.textContent = msg; }
  function capLater() { clearTimeout(capOpen.t); capOpen.t = setTimeout(function wait() { if (CV.busy || CV.listening || busy) { capOpen.t = setTimeout(wait, 1500); return; } vCap.hidden = true; }, 9000); }
  function capHide() { clearTimeout(capOpen.t); vCap.hidden = true; }
  vMic.onclick = () => {
    if (CV.busy || VOICE.playing) { cvHalt(); stopVoice(); return; }
    if (!CC_WEB) { cvDictate(); return; }
    capOpen(); const b = capBody(); b.replaceChildren(el('div', 'you', 'Listening…')); capStatus();
    caesarListen(false);
  };
  vMic.onpointerenter = () => { if (CC_WEB && !CV.tts && !CV.loading && !(navigator.connection && navigator.connection.saveData)) cvLoad().catch(() => { /* reported on use */ }); };
  if (!CC_WEB) { vMic.title = 'Dictate to Caesar with your keyboard microphone'; vMic.querySelector('b').textContent = 'Dictate'; }
  // after the first successful use the voice is cached: warm it quietly in the background
  try { if (localStorage.getItem('cv-warm') === '1') setTimeout(() => { (window.requestIdleCallback || setTimeout)(() => cvLoad().catch(() => { /* reported on use */ }), 2000); }, 2500); } catch (e) { /* convenience only */ }

  /* ----- Caesar's only voice: Jerry B. (British RP). The data repo records the briefing and critical alerts (data/voice/);
     this page plays them with Web Audio. Live conversation goes through Caesar's ElevenLabs agent. ----- */
  const VRAW = 'https://raw.githubusercontent.com/Montezuma360/koochooloo-data/main/';
  const VOICE = { ix: null, heard: [], queue: [], playing: null, src: null, ctx: null, error: null };
  try { VOICE.heard = JSON.parse(localStorage.getItem('caesar-heard') || '[]'); if (!Array.isArray(VOICE.heard)) VOICE.heard = []; } catch (e) { VOICE.heard = []; }
  async function readBin(path) {
    if (MCP && MCP.web) { const r = await fetch(VRAW + path); if (!r.ok) throw new Error('GitHub answered ' + r.status); return new Uint8Array(await r.arrayBuffer()); }
    const res = await MCP.callTool('Composio', 'COMPOSIO_MULTI_EXECUTE_TOOL', readInput(path), { cache: false });
    let p = res && res.payload; if (typeof p === 'string') { try { p = JSON.parse(p); } catch (e) { /* keep text */ } }
    const b64 = findB64(p, 0) || findB64(res, 0); if (!b64) throw new Error('the recording came back empty');
    const bin = atob(b64.replace(/\s+/g, '')), out = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out;
  }
  async function pollVoice() {
    if (!MCP) return;
    try { VOICE.ix = await readFile(MCP, 'data/voice/index.json'); VOICE.error = null; }
    catch (e) { VOICE.error = (e && e.message) || 'unknown'; return; }
    const fresh = (VOICE.ix.alerts || []).filter((a) => !VOICE.heard.includes(a.id)).reverse();
    fresh.forEach((a) => { VOICE.heard.push(a.id); if (Date.now() - Date.parse(a.at) < 90 * 60e3 && alertsLoud) VOICE.queue.push(a); });
    try { VOICE.heard = VOICE.heard.slice(-100); localStorage.setItem('caesar-heard', JSON.stringify(VOICE.heard)); } catch (e) { /* convenience only */ }
    if (fresh.length) pumpVoice();
    if (view.id === 'settings') renderSettings();
  }
  function pumpVoice() {
    if (VOICE.playing || !VOICE.queue.length || !alertsLoud) return;
    if (navigator.userActivation && !navigator.userActivation.hasBeenActive) return; // browsers allow sound after one tap: held until then
    const c = VOICE.queue.shift(); playClip(c).then(() => pumpVoice());
  }
  addEventListener('pointerdown', () => setTimeout(pumpVoice, 60), true);
  addEventListener('keydown', () => setTimeout(pumpVoice, 60), true);
  async function playClip(clip) {
    if (!clip || !clip.chunks || !clip.chunks.length) return;
    VOICE.playing = clip; setSpeaking(true);
    try {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) throw new Error('no audio here');
      if (!VOICE.ctx) VOICE.ctx = new AC();
      if (VOICE.ctx.state === 'suspended') await VOICE.ctx.resume();
      const parts = await Promise.all(clip.chunks.map((c) => readBin('data/voice/' + c)));
      const buf = new Uint8Array(parts.reduce((n, p) => n + p.length, 0)); let o = 0; parts.forEach((p) => { buf.set(p, o); o += p.length; });
      const audio = await VOICE.ctx.decodeAudioData(buf.buffer);
      if (VOICE.playing !== clip) return;
      await new Promise((done) => { const src = VOICE.ctx.createBufferSource(); src.buffer = audio; src.connect(VOICE.ctx.destination); src.onended = done; VOICE.src = src; src.start(); });
    } catch (e) { toast('Caesar · the recording could not play'); }
    finally { if (VOICE.playing === clip) { VOICE.playing = null; VOICE.src = null; setSpeaking(false); } }
  }
  function stopVoice() { cvHalt(); VOICE.queue = []; const s = VOICE.src; VOICE.playing = null; VOICE.src = null; try { if (s) s.stop(); } catch (e) { /* already stopped */ } setSpeaking(false); }
  function caesarBriefing() {
    if (VOICE.playing) { stopVoice(); return; }
    const b = VOICE.ix && VOICE.ix.briefing;
    if (b && b.chunks && b.chunks.length) { toast('Caesar · briefing recorded ' + ukTime(b.at)); playClip(b); return; }
    toast(VOICE.ix && VOICE.ix.error ? 'Caesar · ' + VOICE.ix.error : 'Caesar · his recorded briefing is not ready yet');
  }
  function speakToCaesar() { caesarListen(false); }

  syncButtons(); buildUniverse(LIVE); paintTape(); frame(); setView('cc');
})();
</script>

<div id="webHint" role="status" hidden></div>
