<style>
/* Layout: ranked helix scene (rank = height, size = return, colour = party); ranking list top-left, detail right (bottom sheet on phones), control bar bottom. */
:root {
  --bg: #04060b;
  --panel: rgba(9, 14, 26, 0.8);
  --line: #1b2a45;
  --fg: #d8e4f6;
  --dim: #8396b6;
  --buy: #3ee6b0;
  --sell: #e85dff;
  --dem: #5aa2ff;
  --rep: #ff8a4c;
  --exec: #ffd166;
  --other: #b9c4d9;
  --display: "Chakra Petch", "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.45 var(--mono); overflow: hidden; }
canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
.panel { position: fixed; background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-sizing: border-box; }
button { font-family: var(--mono); }
button:focus-visible, summary:focus-visible { outline: 2px solid var(--buy); outline-offset: 2px; }

#head { top: max(16px, env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); width: min(350px, calc(100vw - 32px)); max-height: calc(100% - 100px); overflow: auto; padding: 14px 14px 12px; }
#head h1 { margin: 0; font: 700 22px/1.12 var(--display); letter-spacing: 0.05em; text-transform: uppercase; }
#head h1 .l2 { display: inline-flex; align-items: flex-end; gap: 8px; }
.swans { display: inline-flex; align-items: flex-end; gap: 0; margin-bottom: -2px; color: var(--fg); }
.swan { width: 36px; height: 28px; overflow: visible; }
.swan.two { width: 30px; height: 23px; transform: scaleX(-1); margin-left: -4px; }
.swan .body, .swan .head { fill: var(--fg); }
.swan .wing { stroke: var(--bg); opacity: 0.45; fill: none; }
.swan .neck { stroke: var(--fg); fill: none; }
.swan .beak { fill: var(--exec); }
.swan .eye { fill: var(--bg); }
.swan .rip { stroke: var(--dem); fill: none; opacity: 0.6; transform-box: fill-box; transform-origin: center; }
.swan .bob { animation: bob 3.2s ease-in-out infinite alternate; }
.swan.two .bob { animation-duration: 2.7s; animation-delay: -1.1s; }
.swan .nk { transform-box: view-box; transform-origin: 28px 20px; animation: sway 4.1s ease-in-out infinite alternate; }
.swan.two .nk { animation-duration: 3.6s; animation-delay: -1.7s; }
.swan .rip { animation: rip 3.2s ease-in-out infinite alternate; }
@keyframes bob { from { transform: translateY(0); } to { transform: translateY(-1.6px); } }
@keyframes sway { from { transform: rotate(-4deg); } to { transform: rotate(5deg); } }
@keyframes rip { from { transform: scaleX(0.82); opacity: 0.25; } to { transform: scaleX(1.06); opacity: 0.7; } }
@media (prefers-reduced-motion: reduce) { .swan .bob, .swan .nk, .swan .rip { animation: none; } }

.lede { margin: 8px 0 10px; color: var(--dim); font-size: 12px; }
.median { display: flex; justify-content: space-between; gap: 10px; padding: 7px 8px; border: 1px dashed var(--line); margin-bottom: 8px; font-size: 12px; color: var(--dim); }
.median b { color: var(--sell); font-weight: 500; white-space: nowrap; font-variant-numeric: tabular-nums; }
#list { display: flex; flex-direction: column; }
#list button { all: unset; box-sizing: border-box; display: grid; grid-template-columns: 22px 10px 1fr auto; gap: 8px; align-items: center; padding: 6px 4px; border-top: 1px solid var(--line); cursor: pointer; }
#list button:hover { background: rgba(90, 162, 255, 0.1); }
#list button[aria-current="true"] { background: rgba(62, 230, 176, 0.12); }
#list button:focus-visible { outline: 2px solid var(--buy); }
#list .rk { color: var(--dim); font-variant-numeric: tabular-nums; }
#list .dot { width: 8px; height: 8px; border-radius: 50%; }
#list .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#list .pc { color: var(--buy); font-variant-numeric: tabular-nums; }
summary { cursor: pointer; color: var(--fg); margin: 2px 0 6px; }
details.about { margin-top: 10px; color: var(--dim); font-size: 12px; }
details.about p { margin: 6px 0 0; }

#detail { top: max(16px, env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); width: min(330px, calc(100vw - 32px)); max-height: calc(100% - 100px); overflow: auto; padding: 14px 16px; }
#detail h2 { margin: 0; font: 700 19px/1.15 var(--display); letter-spacing: 0.02em; }
#detail .sub { color: var(--dim); margin: 3px 0 12px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; margin-bottom: 14px; }
.grid div { min-width: 0; }
.grid b { display: block; font: 500 16px/1.15 var(--mono); font-variant-numeric: tabular-nums; }
.grid span { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); }
.up { color: var(--buy); } .down { color: var(--sell); }
#detail h3 { margin: 12px 0 6px; font: 500 10px/1 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); }
.rows { display: flex; flex-direction: column; }
.rows .row { all: unset; box-sizing: border-box; display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 6px 4px; border-top: 1px solid var(--line); }
.rows button.row { cursor: pointer; }
.rows button.row:hover { background: rgba(90, 162, 255, 0.1); }
.rows button.row:focus-visible { outline: 2px solid var(--buy); }
.rows .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rows .m { color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
.rows .m .up, .rows .m .down { font-weight: 500; }
.note { color: var(--dim); font-size: 11px; margin: 10px 0 0; }

#bar { left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); padding: 10px 12px; display: flex; gap: 10px 18px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
#bar .tools { display: flex; gap: 6px; flex-wrap: wrap; }
#bar button { all: unset; box-sizing: border-box; padding: 5px 10px; border: 1px solid var(--line); cursor: pointer; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; }
#bar button:focus-visible { outline: 2px solid var(--buy); }
#bar button[aria-pressed="true"] { border-color: var(--buy); color: var(--buy); }
#bar button#tSell[aria-pressed="true"] { border-color: var(--sell); color: var(--sell); }
#hover { color: var(--dim); flex: 1 1 200px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; color: var(--dim); font-size: 11px; }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
.legend i.sq { border-radius: 0; transform: rotate(45deg); }
.lbl { position: fixed; left: 0; top: 0; pointer-events: none; font: 400 11px/1 var(--mono); color: var(--fg); text-shadow: 0 0 6px var(--bg), 0 0 3px var(--bg); white-space: nowrap; will-change: transform; }
.lbl.f { font-size: 12px; }
@media (max-width: 700px) {
  #detail { top: auto; right: max(16px, env(safe-area-inset-right, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); width: auto; bottom: calc(max(16px, env(safe-area-inset-bottom, 0px)) + 112px); max-height: 38vh; }
  #detail.empty { display: none; }
  #head { max-height: 56vh; }
  #head h1 { font-size: 19px; }
  .lede, .legend { display: none; }
}

/* ---- views, charts, orb ---- */
:root { --barh: 64px; --violet: #8b6cff; --tapeh: 30px; }
#tape { position: fixed; top: 0; left: 0; right: 0; height: var(--tapeh); overflow: hidden; z-index: 6; background: rgba(5, 8, 16, 0.92); border-bottom: 1px solid var(--line); white-space: nowrap; }
#tapeIn { display: inline-flex; gap: 0; animation: tape 90s linear infinite; will-change: transform; }
#tape:hover #tapeIn { animation-play-state: paused; }
#tape .tk { all: unset; cursor: pointer; padding: 0 14px; line-height: var(--tapeh); font-size: 12px; font-variant-numeric: tabular-nums; border-right: 1px solid var(--line); }
#tape .tk b { font-weight: 500; color: var(--dim); } #tape .tk i { font-style: normal; } #tape .tk i.up { color: var(--buy); } #tape .tk i.down { color: var(--sell); }
#tape .tk:focus-visible { outline: 2px solid var(--buy); outline-offset: -2px; }
@keyframes tape { from { transform: translateX(0); } to { transform: translateX(-50%); } }
@media (prefers-reduced-motion: reduce) { #tapeIn { animation: none; } #tape { overflow-x: auto; } }
#head, #detail { top: calc(var(--tapeh) + 12px) !important; }
.deck { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 12px; }
.deck .card { border: 1px solid var(--line); padding: 10px 12px; background: rgba(9, 14, 26, 0.55); min-width: 0; }
.deck .c12 { grid-column: span 12; } .deck .c7 { grid-column: span 7; } .deck .c6 { grid-column: span 6; } .deck .c5 { grid-column: span 5; }
.deck .fresh.card { padding: 8px; }
@media (max-width: 900px) { .deck .c7, .deck .c6, .deck .c5 { grid-column: span 12; } }
.deckSub { display: block; font: 500 11px/1.4 var(--mono); letter-spacing: 0.12em; color: var(--buy); margin-top: 2px; }
#cTitle .swans { vertical-align: -4px; margin-left: 6px; }
.why { margin: 0 0 6px; padding-left: 16px; color: var(--fg); font-size: 12px; } .why li { margin: 3px 0; }
.hero { grid-column: span 12; display: grid; grid-template-columns: 1fr minmax(120px, 190px); gap: 14px; align-items: center; border: 1px solid rgba(255, 110, 50, 0.45); padding: 14px 16px; background: radial-gradient(120% 140% at 85% 60%, rgba(255, 74, 28, 0.28), rgba(120, 10, 20, 0.12) 45%, rgba(9, 14, 26, 0.6) 75%); position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; inset: auto -10% -40% 40%; height: 70%; background: radial-gradient(closest-side, rgba(255, 120, 40, 0.35), rgba(255, 120, 40, 0)); animation: emberPulse 4.5s ease-in-out infinite; pointer-events: none; }
@keyframes emberPulse { 0%, 100% { opacity: 0.55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.06); } }
@media (prefers-reduced-motion: reduce) { .hero::after { animation: none; } }
.hero h3 { margin: 0 0 2px; font: 600 13px/1.2 var(--display); letter-spacing: 0.1em; text-transform: uppercase; color: #ff9a5c; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.regime { font: 500 11px/1 var(--mono); letter-spacing: 0.08em; padding: 4px 8px; border: 1px solid currentColor; }
.regime.off { color: var(--sell); } .regime.on { color: var(--buy); } .regime.mixed { color: var(--exec); }
.brief { list-style: none; margin: 8px 0 10px; padding: 0; display: flex; flex-direction: column; gap: 7px; position: relative; z-index: 1; }
.brief li { font-size: 14px; line-height: 1.45; padding-left: 14px; border-left: 2px solid rgba(255, 140, 70, 0.6); }
.brief li b { font-weight: 500; color: #fff; }
.hero .swanpic { width: 100%; max-height: 210px; object-fit: contain; filter: drop-shadow(0 0 18px rgba(255, 90, 30, 0.75)) brightness(0.9); position: relative; z-index: 1; animation: swanBob 5s ease-in-out infinite; }
@keyframes swanBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@media (prefers-reduced-motion: reduce) { .hero .swanpic { animation: none; } }
@media (max-width: 700px) { .hero { grid-template-columns: 1fr 90px; } .brief li { font-size: 13px; } }
.heroBtns { display: flex; gap: 8px; flex-wrap: wrap; position: relative; z-index: 1; }
.askb { all: unset; box-sizing: border-box; display: inline-block; margin-top: 10px; padding: 5px 10px; border: 1px solid var(--buy); color: var(--buy); cursor: pointer; font-size: 12px; }
.askb:hover, .askb:focus-visible { background: rgba(62, 230, 176, 0.1); outline: none; }
#bar .views { display: flex; gap: 6px; flex-wrap: wrap; }
body:not(.v-c) .only-c { display: none !important; }
body.v-hot #head, body.v-hot #detail, body.v-hot #labels, body.v-timeline #head, body.v-timeline #detail, body.v-timeline #labels, body.v-markets #head, body.v-markets #detail, body.v-markets #labels { display: none; }
body.v-hot #hover, body.v-timeline #hover, body.v-hot .legend, body.v-timeline .legend, body.v-markets #hover, body.v-markets .legend { display: none; }
#charts { top: calc(var(--tapeh) + 12px); left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(var(--barh) + max(16px, env(safe-area-inset-bottom, 0px)) + 96px); padding: 14px 16px; display: none; flex-direction: column; min-height: 0; z-index: 5; background: rgba(7, 11, 21, 0.9); }
body.v-hot #charts, body.v-timeline #charts, body.v-markets #charts { display: flex; }
.livebox { display: flex; gap: 6px; align-items: center; }
.live { font-size: 11px; letter-spacing: 0.04em; padding: 4px 8px; border: 1px solid var(--line); color: var(--dim); white-space: nowrap; }
.live.live { color: var(--buy); border-color: rgba(62, 230, 176, 0.5); }
.live.error { color: var(--exec); border-color: rgba(255, 209, 102, 0.5); }
#bar button#liveGo { border-color: var(--exec); color: var(--exec); }
#bar button[hidden] { display: none; }
body.v-markets #bar .tools { display: none; }
.mkwrap { display: flex; flex-direction: column; gap: 14px; padding-bottom: 8px; }
.fresh { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.fcell { border: 1px solid var(--line); padding: 6px 8px; }
.fcell span { display: block; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); }
.fcell b { font-weight: 500; font-variant-numeric: tabular-nums; }
.fcell small { color: var(--dim); margin-left: 6px; }
.mk h3 { margin: 0 0 4px; font: 600 13px/1.2 var(--display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg); }
.mk h4 { margin: 0 0 4px; font: 500 11px/1.2 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); }
.mnote { margin: 0 0 8px; color: var(--dim); font-size: 11.5px; max-width: 90ch; }
.qgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 6px; }
.qt { all: unset; box-sizing: border-box; border: 1px solid var(--line); padding: 6px 8px; display: flex; flex-direction: column; gap: 1px; cursor: pointer; }
button.qt:hover { border-color: var(--dem); }
.qt span { font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--dim); }
.qt b { font-weight: 500; font-size: 14px; font-variant-numeric: tabular-nums; }
.qt i { font-style: normal; font-size: 11.5px; font-variant-numeric: tabular-nums; color: var(--dim); }
.qt i.up { color: var(--buy); } .qt i.down { color: var(--sell); }
.srow { display: grid; grid-template-columns: minmax(110px, 190px) 1fr 76px; gap: 10px; align-items: center; padding: 3px 0; }
.srow span { font-size: 12px; } .srow em { font-style: normal; font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }
.sbar { position: relative; height: 12px; } .sbar::after { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--dim); opacity: .6; }
.sbar b { position: absolute; top: 0; height: 100%; } .sbar b.p { left: 50%; background: var(--buy); } .sbar b.n { right: 50%; background: var(--sell); }
.tw { overflow-x: auto; }
table.mt { border-collapse: collapse; width: 100%; font-size: 12px; }
table.mt th { text-align: left; font-weight: 500; color: var(--dim); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; padding: 4px 6px; border-bottom: 1px solid var(--line); }
table.mt td { padding: 4px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.mt .n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.mt td.up { color: var(--buy); } table.mt td.down { color: var(--sell); }
.sym { all: unset; cursor: pointer; color: var(--fg); border-bottom: 1px dotted var(--dim); font-weight: 500; }
.sym:hover, .sym:focus-visible { color: var(--buy); border-color: var(--buy); outline: none; }
.mv3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.up { color: var(--buy); } .down { color: var(--sell); }
#charts h2 { margin: 0; font: 700 20px/1.15 var(--display); letter-spacing: 0.03em; text-transform: uppercase; }
#charts .sub { color: var(--dim); margin: 4px 0 10px; max-width: 78ch; font-size: 12px; }
.ctl { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
.ctl span { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; margin-right: 4px; }
.ctl button { all: unset; box-sizing: border-box; padding: 4px 10px; border: 1px solid var(--line); cursor: pointer; font-size: 12px; }
.ctl button[aria-pressed="true"] { border-color: var(--buy); color: var(--buy); }
.ctl button:focus-visible { outline: 2px solid var(--buy); }
#cbody { position: relative; flex: 1; min-height: 0; overflow: auto; }
.legend2 { display: flex; gap: 14px; flex-wrap: wrap; color: var(--dim); font-size: 11px; margin-top: 8px; }
.legend2 i { display: inline-block; width: 10px; height: 10px; margin-right: 5px; vertical-align: -1px; }
.hrow { all: unset; box-sizing: border-box; display: grid; grid-template-columns: minmax(130px, 220px) 1fr minmax(210px, 290px); gap: 12px; align-items: center; width: 100%; padding: 7px 4px; border-top: 1px solid var(--line); cursor: pointer; }
.hrow:hover { background: rgba(90, 162, 255, 0.08); }
.hrow:focus-visible { outline: 2px solid var(--buy); }
.hrow .tk { font: 500 14px/1.1 var(--mono); }
.hrow .tk small { display: block; color: var(--dim); font-size: 11px; font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
.dbar { position: relative; height: 16px; display: grid; grid-template-columns: 1fr 1fr; }
.dbar::after { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--line); }
.dbar .l { display: flex; justify-content: flex-end; }
.dbar .l b { background: var(--sell); height: 100%; }
.dbar .r b { background: var(--buy); height: 100%; display: block; }
.hrow .mt { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
.hrow .mt em { font-style: normal; color: var(--exec); }
.tt { position: absolute; pointer-events: none; background: #0b1426; border: 1px solid var(--line); padding: 7px 9px; font-size: 12px; max-width: 260px; z-index: 3; display: none; }
.tt b { font-weight: 500; }
svg.tl text { font: 400 11px var(--mono); fill: var(--dim); }
svg.tl text.ln { fill: var(--fg); cursor: pointer; }
svg.tl text.ln:hover { fill: var(--buy); }

#orb { position: fixed; left: 50%; bottom: calc(var(--barh) + max(16px, env(safe-area-inset-bottom, 0px)) + 14px); transform: translateX(-50%); width: 62px; height: 62px; border-radius: 50%; border: 0; padding: 0; cursor: pointer; z-index: 31; color: #fff; background: radial-gradient(circle at 34% 30%, #d9fff4 0%, #3ee6b0 22%, #3a7bff 58%, #6a3bd6 100%); box-shadow: 0 0 22px 4px rgba(62, 230, 176, 0.38), 0 0 60px 12px rgba(106, 59, 214, 0.28), inset -6px -8px 16px rgba(4, 6, 11, 0.45); animation: breathe 4.2s ease-in-out infinite; }
#orb::before { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: conic-gradient(from 0deg, rgba(255,255,255,0), rgba(255,255,255,0.45), rgba(255,255,255,0) 40%, rgba(255,255,255,0) 100%); animation: spin 9s linear infinite; mix-blend-mode: soft-light; }
#orb span { position: absolute; left: 50%; top: 100%; transform: translateX(-50%); margin-top: 5px; font: 500 10px var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); white-space: nowrap; }
#orb:focus-visible { outline: 2px solid var(--fg); outline-offset: 4px; }

      execute: (i) => { if (i.symbol && focusStock(i.symbol)) return 'Showing ' + String(i.symbol).toUpperCase() + ' in the universe'; const v = i.view === 'hot' ? 'hot' : i.view === 'timeline' ? 'timeline' : i.view === 'universe' || i.view === 'constellation' ? 'c' : 'markets'; if (i.months && hotSource().rows[String(i.months)]) view.hotWin = String(i.months); if (i.range_years !== undefined) view.tlRange = Number(i.range_years) ? String(i.range_years) : 'all'; setView(v); return 'Showing ' + v; } },
  ];
  const PRIORITY = ['brief', 'stock', 'show', 'scan', 'markets', 'macro', 'crypto', 'news', 'sec_watch', 'paper', 'insider_activity', 'congress_recent', 'ticker_detail', 'data_health', 'options', 'sentiment', 'live_quote', 'company_news', 'crypto_live', 'signals', 'hot_buys', 'trader_detail'];
  const toolList = brainTools().concat(baseTools).sort((x, y) => PRIORITY.indexOf(x.name) - PRIORITY.indexOf(y.name));
  let toolCap = toolList.length; // trimmed to this view's limit once sample.limits() answers

  function addMsg(cls, text) { const d = el('div', 'm ' + cls, text); msgs.append(d); msgs.scrollTop = msgs.scrollHeight; return d; }
  function setBusy(b) { busy = b; orb.classList.toggle('busy', b); cSend.hidden = b; cStop.hidden = !b; cIn.disabled = b; }
  const errCopy = { not_granted: 'Setareh needs your permission to use Claude on this page. Reload and allow it when asked.', rate_limited: 'That was too many requests. Wait a moment and ask again.', session_expired: 'Please sign in to Claude again.', sampling_disabled: 'Claude is not available on this account.', refused: 'Setareh could not answer that one. Try asking it differently.', upstream_error: 'Something interrupted the answer. Ask again.', empty_completion: 'No answer came back. Try rephrasing.' };
  // Setareh's voice: the warmest British woman's voice this device offers, until her own designed voice is connected
  const PREF = ['Sonia', 'Libby', 'Maisie', 'Serena', 'Kate', 'Stephanie', 'Martha', 'Google UK English Female', 'Hazel', 'Susan'];
  let voices = [], chosen = null;
  function loadVoices() {
    if (!('speechSynthesis' in window)) return; voices = speechSynthesis.getVoices(); if (!voices.length) return;
    const gb = voices.filter((v) => /en[-_]GB/i.test(v.lang)), pool = gb.length ? gb : voices.filter((v) => /^en/i.test(v.lang));
    let saved = null; try { saved = localStorage.getItem('setareh-voice'); } catch (e) { /* convenience only */ }
    chosen = voices.find((v) => v.name === saved) || PREF.map((p) => pool.find((v) => v.name.includes(p) && /natural|online|enhanced|premium/i.test(v.name)) || pool.find((v) => v.name.includes(p))).find(Boolean) || pool.find((v) => /female|woman/i.test(v.name)) || pool[0] || voices[0];
    const sel = document.getElementById('cVoiceSel'); if (!sel) return; sel.replaceChildren();
    pool.concat(voices.filter((v) => v.lang && /^fa|^ku/i.test(v.lang))).forEach((v) => { const o = document.createElement('option'); o.value = v.name; o.textContent = v.name.replace(/Microsoft |Google |\(.*?\)| - .*$/g, '').trim() + ' · ' + v.lang; if (chosen && v.name === chosen.name) o.selected = true; sel.append(o); });
    sel.onchange = () => { chosen = voices.find((v) => v.name === sel.value) || chosen; try { localStorage.setItem('setareh-voice', chosen.name); } catch (e) { /* convenience only */ } voiceOn = true; cVoice.setAttribute('aria-pressed', 'true'); speakNow('Silav, koochooloo. This is my voice.'); };
  }
  if ('speechSynthesis' in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
  function speakNow(t) { if (!('speechSynthesis' in window)) return; try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(String(t).replace(/koochooloo/gi, 'koo-choo-loo').replace(/Silav/g, 'Silaav').slice(0, 900)); if (chosen) { u.voice = chosen; u.lang = chosen.lang; } u.rate = 0.92; u.pitch = 1.05; speechSynthesis.speak(u); } catch (e) { /* voice optional */ } }
  window.__speakSetareh = speakNow;
  function speak(t) { if (!voiceOn || !('speechSynthesis' in window)) return; try { speakNow(t); } catch (e) { /* voice is optional */ } }

  async function ask(text) {
    text = text.trim(); if (!text || busy || !sampleFn) return;
    chat.classList.add('open'); $('#hints').hidden = true;
    addMsg('u', text); turns.push({ role: 'user', content: text });
    const bubble = addMsg('a', 'Thinking…'); setBusy(true); ctl = new AbortController();
    const convo = [{ role: 'user', content: rules() }, ...turns.slice(-8)];
    // the list must end on a user turn and not start with two user turns the model reads as one: fine per the API
    try {
      const res = await sampleFn(convo, { ...(toolCap ? { tools: toolList.slice(0, toolCap) } : {}), modelTier: deep ? 'default' : 'quick', signal: ctl.signal, onText: ({ text: t }) => { bubble.textContent = t; msgs.scrollTop = msgs.scrollHeight; } });
      bubble.textContent = res.text; turns.push({ role: 'assistant', content: res.text }); speak(res.text);
    } catch (e) {
      if (e && e.text) { bubble.textContent = e.text; turns.push({ role: 'assistant', content: e.text }); }
      else { bubble.remove(); turns.pop(); }
      if (e && e.code !== 'cancelled') addMsg('a err', errCopy[e.code] || errCopy.upstream_error);
      if (e && (e.code === 'not_granted' || e.code === 'sampling_disabled')) { orb.disabled = true; }
    } finally { setBusy(false); ctl = null; if (!orb.disabled) cIn.focus(); }
  }
  window.__ask = ask; // used by the hot-row click through askOrb below
  function askOrb(q) { if (WEBMODE && !sampleFn) { webHint(q); return; } chat.classList.add('open'); orb.classList.remove('alert'); if (!sampleFn) { return; } ask(q); }

  HINTS.forEach((h) => { const b = el('button', '', h); b.type = 'button'; b.onclick = () => ask(h); $('#hints').append(b); });
  $('#cForm').addEventListener('submit', (e) => { e.preventDefault(); const v = cIn.value; cIn.value = ''; ask(v); });
  cStop.onclick = () => ctl && ctl.abort();
  $('#cClose').onclick = () => chat.classList.remove('open');
  cVoice.onclick = () => { voiceOn = !voiceOn; cVoice.setAttribute('aria-pressed', String(voiceOn)); if (!voiceOn && 'speechSynthesis' in window) try { speechSynthesis.cancel(); } catch (e) { /* ignore */ } };
  orb.onclick = () => { orb.classList.remove('alert'); chat.classList.toggle('open'); if (chat.classList.contains('open') && !orb.disabled) setTimeout(() => cIn.focus(), 0); };
  addEventListener('keydown', (e) => { if (e.key === 'Escape' && chat.classList.contains('open')) chat.classList.remove('open'); });
  // press / (or Ctrl+K, Cmd+K) anywhere to talk to Setareh
  addEventListener('keydown', (e) => {
    const typing = /INPUT|TEXTAREA|SELECT/.test((document.activeElement && document.activeElement.tagName) || '');
    if (orb.disabled || !((e.key === '/' && !typing) || ((e.metaKey || e.ctrlKey) && String(e.key).toLowerCase() === 'k'))) return;
    e.preventDefault(); chat.classList.add('open'); orb.classList.remove('alert'); cIn.focus();
  });
  // Deep mode: the fuller model and longer answers
  const cAlerts = $('#cAlerts'); cAlerts.setAttribute('aria-pressed', String(alertsLoud));
  cAlerts.onclick = toggleAlertsLoud;
  const cDeep = $('#cDeep'); cDeep.setAttribute('aria-pressed', String(deep));
  cDeep.onclick = () => { deep = !deep; cDeep.setAttribute('aria-pressed', String(deep)); try { localStorage.setItem('setareh-deep', deep ? '1' : '0'); } catch (e) { /* convenience only */ } };
  // speak to Setareh where the browser and this view allow the microphone; typing always works
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition, cMic = $('#cMic'); let rec = null;
  if (SR) cMic.hidden = false;
  cMic.onclick = () => {
    if (rec) { try { rec.stop(); } catch (e) { /* already stopped */ } return; }
    try { rec = new SR(); } catch (e) { cMic.hidden = true; return; }
    let heard = ''; rec.lang = 'en-GB'; rec.interimResults = true; rec.maxAlternatives = 1;
    cMic.setAttribute('aria-pressed', 'true');
    rec.onresult = (ev) => { let t = ''; for (let k = 0; k < ev.results.length; k++) t += ev.results[k][0].transcript; cIn.value = t; heard = t; };
    rec.onerror = (ev) => { if (/not-allowed|service-not-allowed|audio-capture/.test(ev.error)) { cMic.hidden = true; addMsg('a err', 'This view does not allow the microphone, so voice input is off here. Type to me instead; I can still speak my answers.'); heard = ''; } };
    rec.onend = () => { cMic.setAttribute('aria-pressed', 'false'); rec = null; const v = heard.trim(); if (v && !busy) { cIn.value = ''; ask(v); } };
    try { rec.start(); } catch (e) { rec = null; cMic.setAttribute('aria-pressed', 'false'); }
  };
  addMsg('a', 'Silav, koochooloo. I am Setareh. I read every feed in the brain and watch it for you. Ask me anything, or say "Brief me".' + (matchMedia('(pointer: fine)').matches ? ' Press / to talk to me from anywhere.' : '') + (new Date().getHours() < 5 ? ' And then rest: the market will still be here tomorrow.' : ''));
  (async () => {
    try { sampleFn = window.claude && window.claude.use ? await window.claude.use('sample') : null; } catch (e) { sampleFn = null; }
    if (sampleFn && sampleFn.limits) sampleFn.limits().then((l) => { toolCap = l && l.tools ? Math.min(toolList.length, l.tools.maxCount || toolList.length) : 0; }).catch(() => { /* keep the full list */ });
    if (!sampleFn && WEBMODE) { body.classList.add('web'); return; }
    if (!sampleFn) { orb.disabled = true; orb.title = 'Setareh needs the Claude viewer'; $('#hints').hidden = true; cIn.disabled = true; cSend.disabled = true; addMsg('a err', 'Chat works when the page is opened inside Claude. The charts still work.'); }
  })();

  syncButtons(); buildUniverse(LIVE); paintTape(); frame(); setView('markets');
})();
